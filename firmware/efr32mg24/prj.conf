# =============================================================
# PROJE: Silabs BLE Audio Peripheral
# STRATEJI: USART0 tamamen Zephyr'den alinip EMLIB/I2S'e birakildi.
#           Konsol cikisi EUSART0 uzerinden PA5/PA6'ya (VCOM) yonlendirildi.
# =============================================================

# --- KONSOL: EUSART0 uzerinden UART (PA5/PA6 = VCOM) ---
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_SILABS_EUSART=y

# Zephyr'in USART (eski tip) surecusunu TAMAMEN kapat
# USART0 artik sadece EMLIB tarafindan I2S icin kullanilacak
CONFIG_UART_GECKO=n

# RTT'yi de yedek olarak tut (J-Link bagliyken ise yarar)
CONFIG_USE_SEGGER_RTT=y

# --- BLUETOOTH SERVER AYARLARI (DISABLED FOR MAXIMUM 175KB TFLM ARENA) ---
CONFIG_BT=n

# --- DONANIM KONTROLU ---
CONFIG_PM=n
CONFIG_PINCTRL=y
CONFIG_GPIO=y
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# Zephyr I2S/Audio/DMA suruculerini KAPATIYORUZ
# (USART0-I2S icin EMLIB + LDMA dogrudan kullaniyor)
CONFIG_I2S=n
CONFIG_AUDIO=n
CONFIG_DMA=n
CONFIG_SPI=n

# --- KORUMA VE YIGIN (OPTIMIZED STACK/HEAP) ---
CONFIG_ARM_MPU=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_SPEED_OPTIMIZATIONS=y

# --- GUCLENDIRILMIS GUC YONETIMI ---
CONFIG_SOC_GECKO_EMU_DCDC=y
CONFIG_SOC_GECKO_EMU_DCDC_MODE_ON=y

# --- TENSORFLOW LITE MICRO & C++ / DSP CONFIGURATION ---
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# TensorFlow Lite Micro
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y
CONFIG_CMSIS_NN=y

# CMSIS-DSP Acceleration & RFFT Transformations
CONFIG_CMSIS_DSP=y
CONFIG_DSP_BACKEND_CMSIS=y
CONFIG_CMSIS_DSP_TRANSFORM=y

# Hardware Floating Point Unit (ARM Cortex-M33 FPU)
CONFIG_FPU=y